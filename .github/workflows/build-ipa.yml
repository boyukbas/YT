# Builds an unsigned .ipa on GitHub's free macOS runners (no Mac needed).
# Sideload it with a free Apple ID afterwards (see README).
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'pipeline/**', 'README.md', 'CLAUDE.md']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
      - name: Build (unsigned)
        run: |
          xcodebuild -project ShortsEditor.xcodeproj -scheme ShortsEditor \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ShortsEditor.app Payload/
          # Ad-hoc signature so sideloading tools find a signature to replace
          # (a fully unsigned app fails with "No code signature found").
          codesign --force --sign - --timestamp=none Payload/ShortsEditor.app
          codesign -dv Payload/ShortsEditor.app
          zip -qr ShortsEditor.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsEditor-ipa
          path: ShortsEditor.ipa
