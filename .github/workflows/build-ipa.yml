# Builds an unsigned .ipa on GitHub's free macOS runners (no Mac needed).
# Sideload it with a free Apple ID afterwards (see README).
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project ShortsEditor.xcodeproj -target ShortsEditor \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/ShortsEditor.app Payload/
          zip -qr ShortsEditor.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsEditor-ipa
          path: ShortsEditor.ipa
