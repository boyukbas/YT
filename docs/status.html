<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Channel Status</title>
<meta name="description" content="Almanca Dil Atölyesi: every video, its state and its views.">
<meta name="theme-color" content="#141a26">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #141a26; --panel: #1d2434; --line: #2d3549; --text: #eef1f6; --muted: #9aa4b7;
  --yellow: #ffd21a; --red: #e30a17; --green: #4fd18b; --blue: #7cb3ff; --orange: #ffa94d;
  --font: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
header img { width: 44px; height: 44px; border-radius: 50%; background: #fff; }
h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.filters button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px;
  padding: 6px 12px; font: 600 13px var(--font); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--yellow); color: #15171c; border-color: var(--yellow); }
.day { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  margin: 18px 0 8px; }
.card { display: grid; grid-template-columns: 112px 1fr; gap: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
.thumb { width: 112px; height: 63px; border-radius: 8px; background: #0f1420 center/cover no-repeat;
  display: grid; place-items: center; color: var(--muted); font-size: 12px; overflow: hidden; }
.thumb.short { background-position: center 30%; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 2px; }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--line);
  white-space: nowrap; }
.st-public { background: rgba(79,209,139,.16); color: var(--green); }
.st-scheduled { background: rgba(124,179,255,.16); color: var(--blue); }
.st-ready, .st-uploaded { background: rgba(255,210,26,.16); color: var(--yellow); }
.st-making, .st-new, .st-waiting { background: rgba(255,169,77,.16); color: var(--orange); }
.st-stopped { background: rgba(227,10,23,.2); color: #ff7a6b; }
.when { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.title a { text-decoration: none; }
.title a:hover { text-decoration: underline; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.empty, .error { color: var(--muted); text-align: center; padding: 32px 0; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
@media (max-width: 420px) {
  .card { grid-template-columns: 84px 1fr; }
  .thumb { width: 84px; height: 48px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="brand/logo-trde.png" alt="">
    <div>
      <h1 id="name">Almanca Dil Atölyesi</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div id="list"><div class="empty">Loading…</div></div>
  <footer>Lesson names are shortened on purpose. Views refresh about once an hour.
    <a href="https://www.youtube.com/@sinembb">YouTube channel</a></footer>
</div>
<script>
// Data: the home PC pushes status.json to this repo's "status" branch (pipeline/public.py).
const DATA = 'https://raw.githubusercontent.com/boyukbas/YT/refs/heads/status/status.json';
const STATES = {
  public: 'Public', scheduled: 'Scheduled', uploaded: 'Uploaded (private)', ready: 'Ready to upload',
  making: 'Being made', new: 'New recording', waiting: 'Waiting', stopped: 'Stopped',
};
const FILTERS = [['all', 'All'], ['public', 'Public'], ['coming', 'Coming up'], ['short', 'Shorts'], ['video', 'Videos']];
let data = null, filter = 'all';
try { filter = localStorage.getItem('statusFilter') || 'all'; } catch (e) {}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const num = (n) => new Intl.NumberFormat('en').format(n);
const len = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const date = (t) => new Date(t);
const dayName = (t) => date(t).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const clock = (t) => date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const ago = (t) => {
  const m = Math.round((Date.now() - date(t)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 1440)} days ago`;
};

function pick(v) {
  if (filter === 'public') return v.state === 'public';
  if (filter === 'coming') return v.state !== 'public';
  if (filter === 'short' || filter === 'video') return v.kind === filter;
  return true;
}

function card(v) {
  const c = el('div', 'card');
  const th = el('div', 'thumb' + (v.kind === 'short' ? ' short' : ''));
  if (v.youtube) th.style.backgroundImage = `url(https://i.ytimg.com/vi/${v.youtube}/mqdefault.jpg)`;
  else th.textContent = v.kind === 'lesson' ? '⏳' : (v.kind === 'short' ? 'Short' : 'Video');
  const body = el('div');
  const top = el('div', 'top');
  top.append(el('span', `chip st-${v.state}`, STATES[v.state] || v.state));
  if (v.kind !== 'lesson') top.append(el('span', 'chip', v.kind === 'short' ? 'Short' : 'Video'));
  if (v.time) top.append(el('span', 'when', (v.state === 'scheduled' ? 'goes public ' : '') + clock(v.time)));
  body.append(top);
  const t = el('div', 'title');
  if (v.title && v.youtube) {
    const a = el('a', null, v.title); a.href = `https://youtu.be/${v.youtube}`; a.target = '_blank'; a.rel = 'noopener';
    t.append(a);
  } else {
    t.textContent = `Lesson ${v.lesson}` + (v.part ? ` · Short ${v.part}` : '') + (v.step ? ` · ${v.step}` : '');
  }
  body.append(t);
  const meta = el('div', 'meta');
  if (v.title) meta.append(el('span', null, `Lesson ${v.lesson}`));
  if (v.seconds) meta.append(el('span', null, len(v.seconds)));
  const count = (n, word) => { const s = el('span'); s.append(el('b', null, num(n)), ` ${word}${n === 1 ? '' : 's'}`); return s; };
  if (v.views != null) {
    meta.append(count(v.views, 'view'));
    if (v.likes) meta.append(count(v.likes, 'like'));
    if (v.comments) meta.append(count(v.comments, 'comment'));
  }
  if (v.instagram && v.instagram.url) {
    const a = el('a', null, 'Instagram Reel'); a.href = v.instagram.url; a.target = '_blank'; a.rel = 'noopener';
    meta.append(a);
  }
  body.append(meta);
  c.append(th, body);
  return c;
}

function render() {
  const vs = data.videos || [];
  const ch = data.channel || {};
  document.getElementById('name').textContent = ch.name || 'Channel status';
  document.getElementById('updated').textContent =
    `Updated ${ago(data.generated)} · ${date(data.generated).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}`;
  const pub = vs.filter((v) => v.state === 'public');
  const stats = [
    [ch.subscribers, 'subscribers'],
    [pub.reduce((a, v) => a + (v.views || 0), 0), 'views on these videos'],
    [pub.length, 'public'],
    [vs.filter((v) => v.state !== 'public').length, 'coming up'],
  ];
  const s = document.getElementById('stats'); s.replaceChildren();
  for (const [n, label] of stats) if (n != null) { const d = el('div', 'stat'); d.append(el('b', null, num(n)), el('span', null, label)); s.append(d); }
  const f = document.getElementById('filters'); f.replaceChildren();
  for (const [k, label] of FILTERS) {
    const b = el('button', null, label); b.setAttribute('aria-pressed', String(k === filter));
    b.onclick = () => { filter = k; try { localStorage.setItem('statusFilter', k); } catch (e) {} render(); };
    f.append(b);
  }
  const list = document.getElementById('list'); list.replaceChildren();
  const shown = vs.filter(pick);
  if (!shown.length) { list.append(el('div', 'empty', 'Nothing here yet.')); return; }
  let day = '';
  for (const v of shown) {
    const d = v.time ? dayName(v.time) : 'No date';
    if (d !== day) { day = d; list.append(el('div', 'day', d)); }
    list.append(card(v));
  }
}

async function load() {
  try {
    const r = await fetch(`${DATA}?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    render();
  } catch (e) {
    if (!data) document.getElementById('list').replaceChildren(el('div', 'error', 'The status could not be loaded. Try again in a minute.'));
  }
}
load();
setInterval(load, 5 * 60 * 1000);
setInterval(() => data && render(), 60 * 1000);
</script>
</body>
</html>
