name: ShortsEditor
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ShortsEditor:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ShortsEditor
    info:
      path: ShortsEditor/Info.plist
      properties:
        CFBundleDisplayName: Shorts Editor
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSpeechRecognitionUsageDescription: "Creates subtitles from your video's audio, on your iPhone."
        NSPhotoLibraryAddUsageDescription: "Saves your edited videos to Photos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.shortseditor   # change "yourname" to something unique
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
